<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — FINDLY</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/auth.css" rel="stylesheet">
</head>

<body class="auth-body">
  <div class="auth-card">
    <div class="text-center">
      <span class="auth-logo"><i class="bi bi-search"></i></span>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Sign in to your FINDLY account</p>
    </div>

    <div class="alert alert-danger d-none" id="loginError"></div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">Institute Email</label>
        <input type="email" class="form-control" id="email" placeholder="you@ganpatuniversity.ac.in" required>
      </div>
      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2" id="loginBtn">
        <span class="spinner-border spinner-border-sm d-none me-2" id="loginSpinner"></span>Sign in
      </button>
    </form>

    <div class="text-center mt-4">
      <span class="text-muted small">Don&rsquo;t have an account?</span>
      <a href="register.html" class="small fw-semibold">Register as a Student</a>
    </div>

    <!-- <hr> -->
    <!-- <div class="small text-muted">
      <strong>Demo accounts</strong>
      <div class="mt-1">Student · <code>meet.patel@ganpatuniversity.ac.in</code> / <code>Student@123</code></div>
      <div>Staff &nbsp;&nbsp;&nbsp;· <code>staff@ganpatuniversity.ac.in</code> / <code>Staff@123</code></div>
      <div>Admin &nbsp;· <code>admin@ganpatuniversity.ac.in</code> / <code>Admin@123</code></div>
    </div> -->
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="config/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>

  <script>
    var redirect = new URLSearchParams(location.search).get("redirect");

    (async function () {
      try {
        var u = await API.get("/api/auth/me");
        var map = { STUDENT: "student/dashboard.html", STAFF: "staff/dashboard.html", ADMIN: "admin/dashboard.html" };
        location.href = map[u.role];
        return;
      } catch (_) { }
    })();

    $("#loginForm").on("submit", async function (e) {
      e.preventDefault();
      var email = $("#email").val().trim();
      var password = $("#password").val();
      if (!email || !password) {
        showError("Please enter your email and password.");
        return;
      }
      setLoading(true);
      try {
        var user = await API.post("/api/auth/login", { email: email, password: password });
        var map = { STUDENT: "student/dashboard.html", STAFF: "staff/dashboard.html", ADMIN: "admin/dashboard.html" };
        location.href = redirect || map[user.role];
      } catch (err) {
        showError(err.message || "Login failed.");
        setLoading(false);
      }
    });

    function showError(msg) {
      $("#loginError").removeClass("d-none").text(msg);
    }
    function setLoading(on) {
      $("#loginSpinner").toggleClass("d-none", !on);
      $("#loginBtn").prop("disabled", on);
    }
  </script>
</body>

</html>
