<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports &amp; Statistics — FINDLY</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/admin.css" rel="stylesheet">
</head>
<body data-page="reports-statistics">
  <main class="fin-main">
    <div class="fin-page-head">
      <h1 class="fin-page-title">Reports &amp; Statistics</h1>
      <p class="fin-page-sub mb-0">System-wide numbers, refreshed live from the database.</p>
    </div>

    <div class="row g-3 mb-4" id="statCards"></div>

    <div class="row g-3">
      <div class="col-lg-6">
        <div class="fin-card">
          <div class="fin-card-header"><span><i class="bi bi-box-seam me-2"></i>Found items breakdown</span></div>
          <div class="fin-card-body" id="foundChart"></div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="fin-card">
          <div class="fin-card-header"><span><i class="bi bi-journal-text me-2"></i>Lost items breakdown</span></div>
          <div class="fin-card-body" id="lostChart"></div>
        </div>
      </div>
    </div>
  </main>

  <script>window.BASE = "../";</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../config/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/notifications.js"></script>
  <script src="../assets/js/search-filter.js"></script>
  <script src="../assets/js/student.js"></script>
  <script src="../assets/js/staff.js"></script>
  <script src="../assets/js/admin.js"></script>
  <script>
    Auth.init(["ADMIN"]).then(load);

    async function load() {
      var d = await API.get("/api/dashboard/admin");
      var cards = [
        { icon: "bi-people", bg: "var(--fin-indigo-soft)", color: "var(--fin-indigo)", val: d.totalUsers, label: "Total users", sub: "S: " + (d.usersByRole.STUDENT || 0) + " · St: " + (d.usersByRole.STAFF || 0) + " · A: " + (d.usersByRole.ADMIN || 0) },
        { icon: "bi-hourglass-split", bg: "var(--fin-warning-bg)", color: "#b45309", val: d.pendingApprovals, label: "Pending approvals" },
        { icon: "bi-hand-thumbs-up", bg: "var(--fin-info-bg)", color: "#0369a1", val: d.pendingHandovers, label: "Pending handovers" },
        { icon: "bi-patch-check", bg: "var(--fin-success-bg)", color: "#15803d", val: d.resolvedCount, label: "Resolved" },
        { icon: "bi-check2-circle", bg: "var(--fin-success-bg)", color: "#16a34a", val: d.activeItems, label: "Active items" },
        { icon: "bi-calendar-week", bg: "var(--fin-found-bg)", color: "#b45309", val: d.resolvedThisWeek, label: "Resolved this week" },
      ];
      $("#statCards").html(cards.map(function (c) {
        return '<div class="col-6 col-lg-4">' +
          '<div class="fin-card p-3 d-flex gap-3 align-items-center">' +
            '<div class="fin-stat-icon" style="background:' + c.bg + ";color:" + c.color + '"><i class="bi ' + c.icon + '"></i></div>' +
            "<div><div class='fin-stat-val'>" + c.val + "</div><div class='fin-stat-label'>" + c.label + "</div>" +
            (c.sub ? '<div class="small text-muted">' + c.sub + "</div>" : "") + "</div></div></div>";
      }).join(""));

      renderBreakdown("foundChart", "FOUND", "Found items", d.itemsByTypeStatus);
      renderBreakdown("lostChart", "LOST", "Lost items", d.itemsByTypeStatus);
    }

    function renderBreakdown(id, type, title, rows) {
      var statuses = ["PENDING", "ACTIVE", "CLAIMED", "RESOLVED", "REJECTED"];
      var labels = { PENDING: "Pending", ACTIVE: "Active", CLAIMED: "Claimed", RESOLVED: "Resolved", REJECTED: "Rejected" };
      var colors = { PENDING: "#f59e0b", ACTIVE: "#16a34a", CLAIMED: "#0ea5e9", RESOLVED: "#64748b", REJECTED: "#dc2626" };
      var total = rows.filter(function (r) { return r.itemType === type; }).reduce(function (s, r) { return s + Number(r.total); }, 0) || 0;
      var max = Math.max(1, total);
      var html = '<div class="mb-3 d-flex justify-content-between align-items-center"><span class="fw-semibold">' + title + '</span><span class="badge fin-badge text-bg-dark">' + total + " total</span></div>";
      statuses.forEach(function (st) {
        var row = rows.filter(function (r) { return r.itemType === type && r.status === st; })[0];
        var val = row ? Number(row.total) : 0;
        html += '<div class="d-flex justify-content-between small mb-1 mt-3"><span>' + labels[st] +
          '</span><span class="text-muted fw-semibold">' + val + "</span></div>" +
          '<div class="fin-bar"><div style="width:' + Math.round((val / max) * 100) + "%;background:" + colors[st] + '"></div></div>';
      });
      document.getElementById(id).innerHTML = html;
    }
  </script>
</body>
</html>
