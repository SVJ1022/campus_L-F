<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard — FINDLY</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/admin.css" rel="stylesheet">
</head>
<body data-page="dashboard">
  <main class="fin-main">
    <div class="fin-page-head d-flex flex-wrap justify-content-between align-items-end gap-2">
      <div>
        <h1 class="fin-page-title" id="adminGreeting">Good day</h1>
        <p class="fin-page-sub mb-0">System-wide overview of the campus lost &amp; found.</p>
      </div>
      <div class="d-flex gap-2">
        <a href="log-found-item.html" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Log Found Item</a>
        <a href="moderate-posts.html" class="btn btn-outline-primary"><i class="bi bi-check2-square me-1"></i>Moderate Posts</a>
      </div>
    </div>

    <div class="row g-3 mb-4" id="statCards"></div>

    <div class="row g-3">
      <div class="col-lg-6">
        <div class="fin-card">
          <div class="fin-card-header"><span><i class="bi bi-person-lines-fill me-2"></i>Active users by role</span></div>
          <div class="fin-card-body" id="roleChart"></div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="fin-card">
          <div class="fin-card-header"><span><i class="bi bi-box-seam me-2"></i>Items by type &amp; status</span></div>
          <div class="fin-card-body" id="itemChart"></div>
        </div>
      </div>
    </div>

    <div class="fin-card mt-4">
      <div class="fin-card-header"><span><i class="bi bi-clock-history me-2"></i>Recent activity</span></div>
      <div class="fin-card-body" id="activityFeed"></div>
    </div>
  </main>

  <script>window.BASE = "../";</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../config/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/notifications.js"></script>
  <script src="../assets/js/search-filter.js"></script>
  <script src="../assets/js/student.js"></script>
  <script src="../assets/js/staff.js"></script>
  <script src="../assets/js/admin.js"></script>
  <script>
    Auth.init(["ADMIN"]).then(function (user) {
      $("#adminGreeting").text("Good " + (new Date().getHours() < 12 ? "morning" : "afternoon") + ", " + user.name.split(" ")[0]);
      load();
    });

    async function load() {
      var d = await API.get("/api/dashboard/admin");
      var byRole = d.usersByRole || {};
      var cards = [
        { icon: "bi-people", bg: "var(--fin-indigo-soft)", color: "var(--fin-indigo)", val: d.totalUsers, label: "Total users" },
        { icon: "bi-hourglass-split", bg: "var(--fin-warning-bg)", color: "#b45309", val: d.pendingApprovals, label: "Pending approvals" },
        { icon: "bi-hand-thumbs-up", bg: "var(--fin-info-bg)", color: "#0369a1", val: d.pendingHandovers, label: "Pending handovers" },
        { icon: "bi-patch-check", bg: "var(--fin-success-bg)", color: "#15803d", val: d.resolvedCount, label: "Resolved (all time)" },
        { icon: "bi-check2-circle", bg: "var(--fin-success-bg)", color: "#15803d", val: d.activeItems, label: "Active items" },
        { icon: "bi-calendar-week", bg: "var(--fin-found-bg)", color: "#b45309", val: d.resolvedThisWeek, label: "Resolved this week" },
      ];
      $("#statCards").html(cards.map(function (c) {
        return '<div class="col-6 col-lg-4 col-xl-2"><div class="fin-stat">' +
          '<div class="fin-stat-icon" style="background:' + c.bg + ";color:" + c.color + '"><i class="bi ' + c.icon + '"></i></div>' +
          '<div class="min-w-0"><div class="fin-stat-val">' + c.val + '</div><div class="fin-stat-label">' + c.label + "</div></div></div></div>";
      }).join(""));

      renderRoleChart(byRole);
      renderItemChart(d.itemsByTypeStatus);
      renderActivity(d.recentActivity);
    }

    function renderRoleChart(byRole) {
      var roles = [["STUDENT", "Students"], ["STAFF", "Staff"], ["ADMIN", "Admins"]];
      var max = Math.max(1, Math.max(byRole.STUDENT || 0, byRole.STAFF || 0, byRole.ADMIN || 0));
      var html = roles.map(function (r) {
        var val = byRole[r[0]] || 0;
        return '<div class="mb-3"><div class="d-flex justify-content-between small mb-1"><span class="fw-semibold">' + r[1] +
          '</span><span class="text-muted">' + val + "</span></div>" +
          '<div class="fin-bar"><div style="width:' + Math.round((val / max) * 100) + "%;background:var(--fin-indigo)\"></div></div></div>";
      }).join("");
      document.getElementById("roleChart").innerHTML = html;
    }

    function renderItemChart(rows) {
      var statuses = ["PENDING", "ACTIVE", "CLAIMED", "RESOLVED", "REJECTED"];
      var labels = { PENDING: "Pending", ACTIVE: "Active", CLAIMED: "Claimed", RESOLVED: "Resolved", REJECTED: "Rejected" };
      var colors = { PENDING: "#f59e0b", ACTIVE: "#16a34a", CLAIMED: "#0ea5e9", RESOLVED: "#64748b", REJECTED: "#dc2626" };
      function series(type) {
        var total = rows.filter(function (r) { return r.itemType === type; }).reduce(function (s, r) { return s + Number(r.total); }, 0) || 0;
        var max = Math.max(1, total);
        return statuses.map(function (st) {
          var row = rows.filter(function (r) { return r.itemType === type && r.status === st; })[0];
          var val = row ? Number(row.total) : 0;
          return '<div class="d-flex justify-content-between small mb-1"><span>' + labels[st] +
            '</span><span class="text-muted">' + val + "</span></div>" +
            '<div class="fin-bar mb-2"><div style="width:' + Math.round((val / max) * 100) + "%;background:" + colors[st] + '"></div></div>';
        }).join("");
      }
      var byTotal = function (t) { return (rows.filter(function (r) { return r.itemType === t; }).reduce(function (s, r) { return s + Number(r.total); }, 0) || 0); };
      document.getElementById("itemChart").innerHTML =
        '<div class="mb-3"><div class="d-flex justify-content-between align-items-center mb-2">' +
          '<span class="fw-semibold small"><span class="badge fin-badge fin-badge-found">FOUND</span> — ' + byTotal("FOUND") + "</span></div>" + series("FOUND") + "</div>" +
        '<div><div class="d-flex justify-content-between align-items-center mb-2">' +
          '<span class="fw-semibold small"><span class="badge fin-badge fin-badge-lost">LOST</span> — ' + byTotal("LOST") + "</span></div>" + series("LOST") + "</div>";
    }

    function renderActivity(rows) {
      $("#activityFeed").html(rows.length ? rows.map(Admin.activityItem).join("") : '<div class="fin-empty"><i class="bi bi-inbox"></i>No activity yet.</div>');
    }
  </script>
</body>
</html>
