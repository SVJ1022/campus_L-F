<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications — FINDLY</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/student.css" rel="stylesheet">
</head>
<body data-page="notifications">
  <main class="fin-main">
    <div class="fin-page-head">
      <h1 class="fin-page-title">Notifications</h1>
      <p class="fin-page-sub mb-0">Updates about your reports and items you&rsquo;re involved with.</p>
    </div>

    <div class="fin-card">
      <div class="fin-card-body p-0" id="notifPageList">
        <div class="fin-empty"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Loading…</div>
      </div>
    </div>
  </main>

  <script>window.BASE = "../";</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../config/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/notifications.js"></script>
  <script src="../assets/js/search-filter.js"></script>
  <script src="../assets/js/student.js"></script>
  <script>
    Auth.init(["ADMIN"]).then(load);

    async function load() {
      var list = $("#notifPageList");
      try {
        var d = await Notifications.loadAll();
        list.html("");
        if (!d.notifications.length) {
          list.html('<div class="fin-empty"><i class="bi bi-bell-slash"></i>You have no notifications.</div>');
          return;
        }
        var el = document.createElement("div");
        d.notifications.forEach(function (n) {
          var row = document.createElement("div");
          row.className = "d-flex align-items-start gap-3 p-3 " + (Number(n.isRead) ? "bg-white" : "bg-white");
          row.style.cssText = Number(n.isRead) ? "" : "background:var(--fin-indigo-soft)";
          row.innerHTML =
            '<div class="fin-avatar mt-1" style="width:36px;height:36px;font-size:0.95rem"><i class="bi ' + (Number(n.isRead) ? "bi-bell" : "bi-bell-fill") + '"></i></div>' +
            '<div class="flex-grow-1">' +
              '<div>' + Auth.escapeHtml(n.message) + '</div>' +
              '<div class="small text-muted mt-1">' + window.formatDateTime(n.createdAt) + (n.itemTitle ? " · " + Auth.escapeHtml(n.itemTitle) : "") + "</div>" +
            "</div>" +
            (Number(n.isRead)
              ? ""
              : '<button class="btn btn-sm btn-soft read-btn" data-id="' + n.notificationId + '">Mark read</button>');
          el.appendChild(row);
        });

        var doneReading = [];
        el.addEventListener("click", function (e) {
          var b = e.target.closest(".read-btn");
          if (!b) return;
          b.disabled = true;
          b.textContent = "Read ✓";
          (async function () {
            try {
              await Notifications.markRead(Number(b.dataset.id));
              doneReading.push(1);
              if (doneReading.length >= el.querySelectorAll(".read-btn").length) {
                Notifications.refreshBadge();
                window.showToast("All caught up!");
                load();
              }
            } catch (err) {
              window.showToast(err.message, "danger");
            }
          })();
        });

        list.append(el);
      } catch (err) {
        list.html('<div class="fin-empty fin-empty-error">Could not load notifications.</div>');
      }
    }
  </script>
</body>
</html>
