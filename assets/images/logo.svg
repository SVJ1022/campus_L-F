<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <!-- Definition for reusable colors -->
  <defs>
    <style>
      .navy { fill: #0F3966; }
      .yellow { fill: #F4A200; }
      .navy-stroke { stroke: #0F3966; fill: none; }
      .yellow-stroke { stroke: #F4A200; fill: none; }
    </style>
  </defs>

  <!-- Sparkles (Top Right) -->
  <g class="yellow">
    <rect x="280" y="70" width="14" height="42" rx="7" transform="rotate(35 287 91)" />
    <rect x="310" y="102" width="14" height="38" rx="7" transform="rotate(58 317 121)" />
    <rect x="320" y="145" width="14" height="34" rx="7" transform="rotate(80 327 162)" />
  </g>

  <!-- Base Ellipse Shadow Under Pin -->
  <ellipse cx="200" cy="355" rx="55" ry="18" class="navy-stroke" stroke-width="12"/>
  <ellipse cx="200" cy="355" rx="20" ry="7" class="yellow"/>

  <!-- Main Pin Body & Magnifying Glass Ring -->
  <path d="M 200 80 
           C 125 80, 75 140, 75 210 
           C 75 265, 125 320, 192 348 
           C 197 350, 203 350, 208 348 
           C 275 320, 325 265, 325 210 
           C 325 140, 275 80, 200 80 Z" 
        class="navy"/>

  <!-- Magnifying Glass Handle -->
  <rect x="250" y="255" width="28" height="34" rx="6" class="yellow" transform="rotate(-38 264 272)"/>
  <rect x="270" y="270" width="46" height="85" rx="23" class="navy" transform="rotate(-38 293 312)"/>

  <!-- White Inner Pin Circle -->
  <circle cx="200" cy="205" r="92" fill="#FFFFFF"/>

  <!-- Yellow Arch in Upper Inner Circle -->
  <path d="M 124 195 A 78 78 0 0 1 270 148" class="yellow-stroke" stroke-width="12" stroke-linecap="round"/>

  <!-- Backpack Container -->
  <g transform="translate(136, 130)">
    <!-- Backpack Strap Handles -->
    <path d="M 44 26 C 44 10, 84 10, 84 26" class="navy-stroke" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Backpack Main Body -->
    <rect x="24" y="24" width="80" height="90" rx="28" class="navy"/>
    
    <!-- Backpack Side Pockets -->
    <rect x="12" y="52" width="18" height="38" rx="8" class="navy"/>
    <rect x="98" y="52" width="18" height="38" rx="8" class="navy"/>

    <!-- Yellow Front Pocket -->
    <rect x="36" y="70" width="56" height="36" rx="10" class="yellow"/>
    <!-- Zipper Line -->
    <line x1="44" y1="80" x2="84" y2="80" class="navy-stroke" stroke-width="4" stroke-linecap="round"/>
    <circle cx="44" cy="80" r="3" class="navy"/>

    <!-- Diamond Leather Badge -->
    <rect x="54" y="38" width="20" height="20" rx="4" class="yellow" transform="rotate(45 64 48)"/>
    <line x1="62" y1="48" x2="62" y2="52" class="navy-stroke" stroke-width="3" stroke-linecap="round"/>
    <line x1="66" y1="48" x2="66" y2="52" class="navy-stroke" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- FINDLY Text Logo Section -->
  <g transform="translate(20, 440)">
    <!-- F -->
    <path d="M 10 0 H 52 V 16 H 28 V 28 H 48 V 44 H 28 V 70 H 10 Z" class="navy"/>
    
    <!-- I -->
    <path d="M 62 0 H 80 V 70 H 62 Z" class="navy"/>
    
    <!-- N -->
    <path d="M 90 0 H 108 L 130 40 V 0 H 148 V 70 H 130 L 108 30 V 70 H 90 Z" class="navy"/>
    
    <!-- D (Pin Shape D) -->
    <g transform="translate(158, 0)">
      <path d="M 0 0 H 30 C 50 0 65 15 65 35 C 65 55 50 70 30 70 H 0 Z" class="yellow"/>
      <!-- Inner Pin Cutout in D -->
      <path d="M 28 20 C 20 20 16 26 16 34 C 16 46 28 54 28 54 C 28 54 40 46 40 34 C 40 26 36 20 28 20 Z" fill="#FFFFFF"/>
      <circle cx="28" cy="31" r="4" class="yellow"/>
    </g>

    <!-- L -->
    <path d="M 235 0 H 253 V 54 H 282 V 70 H 235 Z" class="navy"/>

    <!-- Y -->
    <path d="M 290 0 H 310 L 326 34 L 342 0 H 362 L 335 42 V 70 H 317 V 42 Z" class="navy"/>
  </g>
</svg>
