<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Reports — FINDLY</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/student.css" rel="stylesheet">
</head>
<body data-page="my-reports">
  <main class="fin-main">
    <div class="fin-page-head d-flex flex-wrap justify-content-between align-items-end gap-2">
      <div>
        <h1 class="fin-page-title">My Reports</h1>
        <p class="fin-page-sub mb-0">Everything you&rsquo;ve reported as lost and its current status.</p>
      </div>
      <a href="report-lost.html" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Report new</a>
    </div>

    <div class="fin-card">
      <div class="fin-card-body p-0">
        <div class="table-responsive">
          <table class="table fin-table align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Item</th>
                <th>Category</th>
                <th>Last seen</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="reportsBody"></tbody>
          </table>
          <div id="reportsEmpty" class="d-none"><div class="fin-empty"><i class="bi bi-inbox"></i>You haven&rsquo;t reported anything yet.</div></div>
        </div>
      </div>
    </div>
  </main>

  <script>window.BASE = "../";</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../config/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/notifications.js"></script>
  <script src="../assets/js/search-filter.js"></script>
  <script src="../assets/js/student.js"></script>
  <script>
    var items = [];
    Auth.init(["STUDENT"]).then(load);

    async function load() {
      try {
        var d = await API.get("/api/items?type=LOST");
        items = d.items;
        render();
      } catch (err) {
        $("#reportsBody").html('<tr><td class="py-4 text-center text-danger" colspan="5">Could not load your reports.</td></tr>');
      }
    }

    function render() {
      var el = document.getElementById("reportsBody");
      el.innerHTML = "";
      if (!items.length) {
        document.getElementById("reportsEmpty").classList.remove("d-none");
        return;
      }
      items.forEach(function (it) {
        var editable = it.status === "PENDING" || it.status === "ACTIVE";
        var tr = document.createElement("tr");
        tr.innerHTML =
          '<td>' +
            '<div class="d-flex align-items-center gap-2">' +
              '<img src="' + ItemUI.image(it) + '" class="fin-thumb" alt="">' +
              '<div><div class="fw-semibold"><a href="item-details.html?id=' + it.itemId + '" class="text-ink">' + Auth.escapeHtml(it.title) + "</a></div>" +
              '<div class="small text-muted">' + ItemUI.shortDate(it.itemDate) + "</div></div></div></td>" +
          "<td>" + Auth.escapeHtml(it.categoryName) + "</td>" +
          "<td>" + Auth.escapeHtml(it.location) + "</td>" +
          "<td>" + ItemUI.statusBadge(it.status) + "</td>" +
          '<td class="text-end">' +
            (editable
              ? '<a href="report-lost.html?edit=' + it.itemId + '" class="btn btn-sm btn-soft me-1" title="Edit"><i class="bi bi-pencil"></i> Edit</a>' +
                '<button class="btn btn-sm btn-soft-danger delete-btn" data-id="' + it.itemId + '" title="Delete"><i class="bi bi-trash"></i></button>'
              : '<span class="small text-muted">Closed</span>') +
          "</td>";
        el.appendChild(tr);
      });
      el.querySelectorAll(".delete-btn").forEach(function (b) {
        b.addEventListener("click", function () { deleteItem(Number(b.dataset.id)); });
      });
    }

    async function deleteItem(id) {
      if (!confirm("Delete this report? This cannot be undone.")) return;
      try {
        await API.del("/api/items/" + id);
        window.showToast("Report deleted.");
        load();
      } catch (err) {
        window.showToast(err.message, "danger");
      }
    }
  </script>
</body>
</html>
