<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse Found Items — FINDLY</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/student.css" rel="stylesheet">
</head>
<body data-page="browse-found">
  <main class="fin-main">
    <div class="fin-browse-hero text-center">
      <h1 class="fin-page-title">Find something you lost</h1>
      <p class="fin-page-sub mb-3">These are verified found items currently in campus custody.</p>
    </div>

    <form id="searchForm" class="row g-2 g-md-3 align-items-end mb-4" novalidate>
      <div class="col-12">
        <div class="input-group input-group-lg fin-search-bar">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
          <input type="text" class="form-control border-start-0" id="q" name="q" placeholder="Search by keyword, e.g. charger, wallet, ID card…" aria-label="Keyword">
        </div>
      </div>
      <div class="col-12 col-md-3">
        <select class="form-select" id="category" name="category"><option value="">All categories</option></select>
      </div>
      <div class="col-6 col-md-3">
        <input type="date" class="form-control" id="date" name="date" aria-label="Date found">
      </div>
      <div class="col-6 col-md-3">
        <input type="text" class="form-control" id="location" name="location" placeholder="Location…">
      </div>
      <div class="col-6 col-md-3 d-flex gap-2">
        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-funnel me-1"></i>Filter</button>
        <button type="reset" class="btn btn-light border w-50" title="Clear filters"><i class="bi bi-x-lg"></i></button>
      </div>
    </form>

    <div class="d-flex justify-content-between align-items-center mb-2">
      <span id="resultCount" class="small text-muted"></span>
    </div>

    <div id="itemsGrid" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3"></div>
  </main>

  <script>window.BASE = "../";</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../config/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/notifications.js"></script>
  <script src="../assets/js/search-filter.js"></script>
  <script src="../assets/js/student.js"></script>
  <script>
    Auth.init(["STUDENT"]).then(async function () {
      await SearchFilter.loadCategories(document.getElementById("category"), true);
      loadItems("/api/items?type=FOUND&status=ACTIVE");
    });

    SearchFilter.bind("searchForm", "/api/items?type=FOUND&status=ACTIVE", function (target) {
      loadItems(target);
    });

    async function loadItems(path) {
      var grid = $("#itemsGrid");
      grid.html(Student.loadingStateHTML());
      try {
        var d = await API.get(path);
        $("#resultCount").text(d.count + " found item" + (d.count === 1 ? "" : "s") + " on campus");
        grid.html(d.items.length
          ? d.items.map(Student.itemCard).join("")
          : '<div class="col-12">' + Student.emptyState("No items match your search — try different keywords or clear the filters.") + "</div>");
      } catch (err) {
        grid.html('<div class="col-12">' + Student.emptyState("Could not load items.") + "</div>");
      }
    }
  </script>
</body>
</html>
