<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile — FINDLY</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/student.css" rel="stylesheet">
</head>
<body data-page="profile">
  <main class="fin-main">
    <div class="fin-page-head">
      <h1 class="fin-page-title">My Profile</h1>
      <p class="fin-page-sub mb-0">Your account details. Email cannot be changed.</p>
    </div>

    <div class="row g-4" style="max-width:860px">
      <div class="col-lg-4">
        <div class="fin-card p-4 text-center">
          <div class="fin-avatar mx-auto mb-3" style="width:72px;height:72px;font-size:1.9rem" id="profileAvatar">?</div>
          <h5 class="mb-0" id="profileName">—</h5>
          <div class="text-muted small" id="profileEmail">—</div>
          <span class="badge fin-badge-role mt-2" id="profileRole">—</span>
          <div class="small text-muted mt-3" id="profileJoined"></div>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="fin-card">
          <div class="fin-card-body">
            <form id="profileForm" class="row g-3" novalidate>
              <div class="col-12">
                <label class="form-label" for="pName">Full Name</label>
                <input type="text" class="form-control" id="pName" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="pContact">Contact Number</label>
                <input type="tel" class="form-control" id="pContact" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="pEnroll">Enrollment / Employee Number</label>
                <input type="text" class="form-control" id="pEnroll" required>
              </div>
              <div class="col-12 pt-2">
                <label class="form-label" for="pEmail">Institute Email <span class="text-muted fw-normal">(read-only)</span></label>
                <input type="email" class="form-control" id="pEmail" disabled>
              </div>
              <div class="col-12">
                <div class="form-label mb-1">Change password <span class="text-muted fw-normal">(leave blank to keep current)</span></div>
                <div class="row g-2">
                  <div class="col-md-6">
                    <input type="password" class="form-control" id="pPassword" placeholder="New password">
                  </div>
                  <div class="col-md-6">
                    <input type="password" class="form-control" id="pConfirm" placeholder="Confirm new password">
                  </div>
                </div>
              </div>
              <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary px-4" id="saveBtn">
                  <span class="spinner-border spinner-border-sm d-none me-2" id="saveSpinner"></span>Save changes
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>window.BASE = "../";</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../config/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/notifications.js"></script>
  <script src="../assets/js/search-filter.js"></script>
  <script src="../assets/js/student.js"></script>
  <script>
    Auth.init(["STUDENT"]).then(function (user) {
      fill(user);
    });

    function fill(u) {
      $("#profileAvatar").text((u.name || "?").charAt(0).toUpperCase());
      $("#profileName").text(u.name);
      $("#profileEmail").text(u.email);
      $("#profileRole").text(Auth.roleLabel(u.role));
      $("#profileJoined").text("Joined " + window.formatDateTime(u.createdAt));
      $("#pName").val(u.name);
      $("#pContact").val(u.contactNo || "");
      $("#pEnroll").val(u.enrollmentNo || "");
      $("#pEmail").val(u.email);
    }

    $("#profileForm").on("submit", async function (e) {
      e.preventDefault();
      var payload = {
        name: $("#pName").val().trim(),
        contactNo: $("#pContact").val().trim(),
        enrollmentNo: $("#pEnroll").val().trim(),
      };
      var p1 = $("#pPassword").val(), p2 = $("#pConfirm").val();
      if (p1 || p2) {
        if (p1 !== p2) { window.showToast("New passwords do not match.", "warning"); return; }
        if (p1.length < 6) { window.showToast("Password must be at least 6 characters.", "warning"); return; }
        payload.password = p1;
      }
      if (!payload.name || !payload.contactNo || !payload.enrollmentNo) {
        window.showToast("Name, contact and enrollment are required.", "warning");
        return;
      }

      $("#saveSpinner").removeClass("d-none");
      $("#saveBtn").prop("disabled", true);
      try {
        var u = await API.put("/api/profile", payload);
        fill(u);
        $("#pPassword, #pConfirm").val("");
        window.showToast("Profile updated.");
      } catch (err) {
        var msg = err.fieldErrors ? Object.values(err.fieldErrors).join(" · ") : err.message;
        window.showToast(msg, "danger");
      } finally {
        $("#saveSpinner").addClass("d-none");
        $("#saveBtn").prop("disabled", false);
      }
    });
  </script>
</body>
</html>
