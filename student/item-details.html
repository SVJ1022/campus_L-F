<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Item Details — FINDLY</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/student.css" rel="stylesheet">
</head>
<body data-page="item-details">
  <main class="fin-main">
    <div id="detailWrap" style="max-width:860px">
      <div class="fin-empty"><div class="spinner-border text-primary"></div></div>
    </div>
  </main>

  <script>window.BASE = "../";</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../config/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/notifications.js"></script>
  <script src="../assets/js/search-filter.js"></script>
  <script src="../assets/js/student.js"></script>
  <script>
    var id = new URLSearchParams(location.search).get("id");
    if (!id) { location.href = "browse-found.html"; }

    Auth.init(["STUDENT"]).then(load);

    async function load() {
      var wrap = $("#detailWrap");
      try {
        var d = await API.get("/api/items/" + id);
        var it = d.item;
        var found = it.itemType === "FOUND";
        var html =
          '<a href="' + (found ? "browse-found.html" : "my-reports.html") + '" class="btn btn-light border btn-sm mb-3"><i class="bi bi-arrow-left me-1"></i>Back</a>' +
          '<div class="fin-card overflow-hidden">' +
            '<div class="row g-0">' +
              '<div class="col-md-5">' +
                '<img src="' + ItemUI.image(it) + '" class="w-100 h-100" style="object-fit:cover;min-height:240px" alt="' + Auth.escapeHtml(it.title) + '">' +
              "</div>" +
              '<div class="col-md-7"><div class="fin-card-body">' +
                '<div class="d-flex align-items-center gap-2 flex-wrap mb-2">' +
                  ItemUI.typeBadge(it.itemType) + " " + ItemUI.statusBadge(it.status) +
                  '<span class="badge fin-badge text-bg-light border ms-auto">' + Auth.escapeHtml(it.categoryName) + "</span>" +
                "</div>" +
                '<h1 class="h3 fw-bold">' + Auth.escapeHtml(it.title) + "</h1>" +
                '<div class="fin-item-meta mb-3"><span><i class="bi bi-geo-alt me-1"></i>' + Auth.escapeHtml(it.location) + "</span>" +
                  '<span><i class="bi bi-calendar3 me-1"></i>' + ItemUI.shortDate(it.itemDate) + "</span>" +
                  '<span><i class="bi bi-person me-1"></i>Reported by ' + Auth.escapeHtml(it.postedByName) + "</span></div>" +
                '<p class="text-muted">' + Auth.escapeHtml(it.description) + "</p>" +
                '<div class="card border-0 bg-light rounded-3 p-3">' +
                  '<div class="small text-muted mb-2"><i class="bi bi-info-circle me-1"></i>Found item? It is being held securely.</div>' +
                  '<div class="d-flex flex-wrap gap-2 align-items-center">' +
                    (found
                      ? '<span class="badge fin-badge fin-badge-found"><i class="bi bi-archive me-1"></i>Custody: ' + Auth.escapeHtml(it.custodyLocation || "Campus Security Office") + "</span>"
                      : '<span class="small text-muted">Keep an eye on this report for status updates.</span>') +
                  "</div>" +
                "</div>" +
              "</div></div>" +
            "</div>" +
          "</div>";
        wrap.html(html);
      } catch (err) {
        wrap.html('<div class="fin-empty fin-empty-error"><i class="bi bi-exclamation-circle"></i>Item not found or not visible to you.</div>');
      }
    }
  </script>
</body>
</html>
