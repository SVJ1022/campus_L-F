<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moderate Posts — FINDLY</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/admin.css" rel="stylesheet">
</head>
<body data-page="moderate-posts">
  <main class="fin-main">
    <div class="fin-page-head">
      <h1 class="fin-page-title">Moderate Posts</h1>
      <p class="fin-page-sub mb-0">Approve or reject items waiting for review. The reporter is notified either way.</p>
    </div>

    <div class="fin-card">
      <div class="fin-card-header"><span><i class="bi bi-hourglass-split me-2"></i>Pending review</span></div>
      <div class="fin-card-body p-0">
        <div class="table-responsive">
          <table class="table fin-table align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Item</th><th>Type</th><th>Reported by</th><th>Location</th><th>Date</th><th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="pendingBody"></tbody>
          </table>
          <div id="pendingEmpty" class="fin-empty d-none"><i class="bi bi-check2-circle"></i>Nothing pending — you&rsquo;re all caught up.</div>
          <div class="fin-empty d-none" id="pendingLoading"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Loading…</div>
        </div>
      </div>
    </div>
  </main>

  <script>window.BASE = "../";</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../config/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/notifications.js"></script>
  <script src="../assets/js/search-filter.js"></script>
  <script src="../assets/js/student.js"></script>
  <script src="../assets/js/staff.js"></script>
  <script src="../assets/js/admin.js"></script>
  <script>
    Auth.init(["ADMIN"]).then(load);
    Notifications.refreshBadge();

    async function load() {
      $("#pendingLoading").removeClass("d-none");
      $("#pendingEmpty").addClass("d-none");
      try {
        var d = await API.get("/api/items?status=PENDING");
        var body = $("#pendingBody");
        body.empty();
        if (!d.items.length) { $("#pendingEmpty").removeClass("d-none"); }
        d.items.forEach(function (it) {
          var tr = document.createElement("tr");
          tr.innerHTML =
            "<td>" +
              '<div class="d-flex align-items-center gap-2"><img src="' + ItemUI.image(it) + '" class="fin-thumb" alt="">' +
              '<div><div class="fw-semibold">' + Auth.escapeHtml(it.title) + "</div>" +
              '<div class="small text-muted">' + Auth.escapeHtml(it.description).slice(0, 60) + '…</div></div></div></td>' +
            "<td>" + ItemUI.typeBadge(it.itemType) + "</td>" +
            "<td>" + Auth.escapeHtml(it.postedByName) + "</td>" +
            "<td class='small'>" + Auth.escapeHtml(it.location) + "</td>" +
            "<td class='small'>" + ItemUI.shortDate(it.itemDate) + "</td>" +
            '<td class="text-end whitespace-nowrap">' +
              '<button class="btn btn-sm btn-soft-success approve-btn" data-id="' + it.itemId + '" data-title="' + Auth.escapeHtml(it.title) + '"><i class="bi bi-check-lg me-1"></i>Approve</button> ' +
              '<button class="btn btn-sm btn-soft-danger reject-btn" data-id="' + it.itemId + '" data-title="' + Auth.escapeHtml(it.title) + '"><i class="bi bi-x-lg"></i></button>' +
            "</td>";
          body.append(tr);
        });
        $("#pendingLoading").addClass("d-none");
      } catch (err) {
        $("#pendingLoading").addClass("d-none");
        $("#pendingBody").html('<tr><td class="py-4 text-center text-danger" colspan="6">Could not load pending items.</td></tr>');
      }
    }

    $("#pendingBody").on("click", ".approve-btn, .reject-btn", async function () {
      var id = Number(this.dataset.id);
      var approve = this.classList.contains("approve-btn");
      var title = this.dataset.title;
      var action = approve ? "approve" : "reject";
      if (!confirm((approve ? "Approve" : "Reject") + ' "' + title + '"? The reporter will be notified.')) return;
      var btn = this, orig = btn.innerHTML;
      btn.disabled = true;
      try {
        var d = await API.put("/api/items/" + id + "/moderate", { decision: approve ? "APPROVE" : "REJECT" });
        window.showToast("Item " + d.newStatus.toLowerCase() + ".");
        load();
        Notifications.refreshBadge();
      } catch (err) {
        window.showToast(err.message, "danger");
        btn.disabled = false;
        btn.innerHTML = orig;
      }
    });
  </script>
</body>
</html>
