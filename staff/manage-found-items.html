<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Found Items — FINDLY</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/staff.css" rel="stylesheet">
</head>
<body data-page="manage-found-items">
  <main class="fin-main">
    <div class="fin-page-head d-flex flex-wrap justify-content-between align-items-end gap-2">
      <div>
        <h1 class="fin-page-title">Manage Found Items</h1>
        <p class="fin-page-sub mb-0">Every found item you&rsquo;ve logged — update custody, claim, record recipients and resolve.</p>
      </div>
      <a href="log-found-item.html" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Log New Found Item</a>
    </div>

    <form id="filterForm" class="row g-2 mb-3" novalidate>
      <div class="col-12 col-sm">
        <input type="text" class="form-control" id="q" name="q" placeholder="Search…">
      </div>
      <div class="col-6 col-sm-auto">
        <select class="form-select" id="status" name="status">
          <option value="">All statuses</option>
          <option value="PENDING">Pending</option>
          <option value="ACTIVE">Active</option>
          <option value="CLAIMED">Claimed</option>
          <option value="RESOLVED">Resolved</option>
          <option value="REJECTED">Rejected</option>
        </select>
      </div>
      <div class="col-6 col-sm-auto">
        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-funnel me-1"></i>Filter</button>
      </div>
    </form>

    <div class="fin-card">
      <div class="fin-card-body p-0">
        <div class="table-responsive">
          <table class="table fin-table align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Item</th><th>Category</th><th>Status</th><th>Custody</th><th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="itemsBody"></tbody>
          </table>
          <div id="itemsEmpty" class="d-none"><div class="fin-empty"><i class="bi bi-archive"></i>No found items match.</div></div>
          <div class="fin-empty d-none" id="itemsLoading"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Loading…</div>
        </div>
      </div>
    </div>
  </main>

  <script>window.BASE = "../";</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../config/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/notifications.js"></script>
  <script src="../assets/js/search-filter.js"></script>
  <script src="../assets/js/student.js"></script>
  <script src="../assets/js/staff.js"></script>
  <script>
    Auth.init(["STAFF", "ADMIN"]).then(function () { load(); Staff.bindTableActions(load); });

    $("#filterForm").on("submit", function (e) {
      e.preventDefault();
      load();
    });

    async function load() {
      var box = $("#itemsBody"), empty = $("#itemsEmpty"), loading = $("#itemsLoading");
      loading.removeClass("d-none"); empty.addClass("d-none");
      var params = SearchFilter.readForm(document.getElementById("filterForm"));
      var qs = SearchFilter.toQueryString(params);
      try {
        var d = await API.get("/api/items?type=FOUND" + (qs ? "&" + qs : ""));
        box.html(d.items.map(function (it) { return Staff.row(it, false); }).join(""));
        empty.toggleClass("d-none", !!d.items.length);
        loading.addClass("d-none");
      } catch (err) {
        loading.addClass("d-none");
        box.html('<tr><td class="py-4 text-center text-danger" colspan="5">Could not load items.</td></tr>');
      }
    }
  </script>
</body>
</html>
